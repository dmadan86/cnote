name: Nightly performance and recovery

# CN-QA-001 performance (section 6) and recovery (section 4) on one runner. Not part of the PR gate.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      rate:
        description: Load test arrival rate (requests per second)
        default: "100"
      duration:
        description: Load test measured duration
        default: 120s

concurrency:
  group: nightly
  cancel-in-progress: false

# Same shape as ci.yml: throwaway trust-auth Postgres, per-run app-role password, no stored credentials.
env:
  DATABASE_ADMIN_URL: postgres://postgres@localhost:5432/cnote

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cnote
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Generate throwaway DB credentials
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          echo "DB_APP_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://cnote_app:$PW@localhost:5432/cnote" >> "$GITHUB_ENV"
          SECRET=$(openssl rand -hex 16)
          echo "::add-mask::$SECRET"
          echo "COLLAB_INTERNAL_SECRET=$SECRET" >> "$GITHUB_ENV"
          MK=$(openssl rand -base64 32)
          echo "::add-mask::$MK"
          echo "CNOTE_MASTER_KEY=$MK" >> "$GITHUB_ENV" # per run; the API and the Go tests share it
      - run: pnpm install --frozen-lockfile
      - name: Migrate, then start the Go API (worker included) and collab
        run: |
          (cd apps/api && go run ./cmd/api migrate && go build -o ../../cnote-api ./cmd/api && go build -o ../../loadtest ./cmd/loadtest)
          echo "alter role cnote_app password :'pw';" | psql "$DATABASE_ADMIN_URL" -v pw="$DB_APP_PASSWORD"
          AUTH_SIGNUP_FREE=100000 AUTH_IP_FREE=100000 PORT=4100 WITH_WORKER=1 COLLAB_URL=http://localhost:4300 COLLAB_INTERNAL_SECRET=$COLLAB_INTERNAL_SECRET ./cnote-api > go-api.log 2>&1 &
          COLLAB_PORT=4300 pnpm --filter @cnote/collab start > collab.log 2>&1 &
          npx --yes wait-on -t 120000 http://localhost:4100/healthz http://localhost:4300/healthz
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/migrations
      # Thresholds are for a shared 4-core runner; they fail the job, so tune them from the nightly history.
      - name: Load test
        run: ./loadtest -api http://localhost:4100 -rate "$RATE" -duration "$DURATION" -p95 400ms -p99 1500ms -max-errors 0.01 | tee loadtest.txt
        env:
          RATE: ${{ inputs.rate || '100' }}
          DURATION: ${{ inputs.duration || '120s' }}
      - name: Recovery tests (Postgres drop, backend termination, worker crash)
        working-directory: apps/api
        run: go test -tags recovery -run TestRecovery -count=1 -timeout 10m -v ./internal/server
      - name: Collab recovery (kill and restart, database unreachable, offline clients) with a larger property-test budget
        run: pnpm --filter @cnote/collab exec vitest run test/resilience.test.ts
        env:
          FC_RUNS: "300"
          API_URL: http://localhost:4100
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results
          path: |
            loadtest.txt
            go-api.log
            collab.log
