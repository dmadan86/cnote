name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No credentials live in this file: the throwaway Postgres uses trust auth and the app-role
# password is generated per run.
env:
  DATABASE_ADMIN_URL: postgres://postgres@localhost:5432/cnote

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cnote
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      # the note.restore tests render live documents through the TypeScript collab service (apps/collab)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate throwaway credentials
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          echo "DB_APP_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://cnote_app:$PW@localhost:5432/cnote" >> "$GITHUB_ENV"
          SECRET=$(openssl rand -hex 16)
          echo "::add-mask::$SECRET"
          echo "COLLAB_INTERNAL_SECRET=$SECRET" >> "$GITHUB_ENV"
          MK=$(openssl rand -base64 32)
          echo "::add-mask::$MK"
          echo "CNOTE_MASTER_KEY=$MK" >> "$GITHUB_ENV" # per run; every process shares it
      - name: Migrate
        run: |
          (cd apps/api && go run ./cmd/api migrate)
          echo "alter role cnote_app password :'pw';" | psql "$DATABASE_ADMIN_URL" -v pw="$DB_APP_PASSWORD"
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/migrations
      - name: Start collab
        run: |
          COLLAB_PORT=4300 pnpm --filter @cnote/collab start > collab.log 2>&1 &
          npx --yes wait-on -t 120000 http://localhost:4300/healthz
      - name: gofmt
        working-directory: apps/api
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        working-directory: apps/api
        run: go vet ./...
      - name: go test
        working-directory: apps/api
        run: go test -race -p 1 -timeout 60m ./... # one package at a time: packages share the CI database and its job queue
        env:
          COLLAB_URL: http://localhost:4300
      - if: failure()
        run: tail -n 100 collab.log

  collab:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cnote
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate throwaway credentials
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          echo "DB_APP_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://cnote_app:$PW@localhost:5432/cnote" >> "$GITHUB_ENV"
          SECRET=$(openssl rand -hex 16)
          echo "::add-mask::$SECRET"
          echo "COLLAB_INTERNAL_SECRET=$SECRET" >> "$GITHUB_ENV"
          MK=$(openssl rand -base64 32)
          echo "::add-mask::$MK"
          echo "CNOTE_MASTER_KEY=$MK" >> "$GITHUB_ENV" # per run; every process shares it
      - name: Migrate
        run: |
          (cd apps/api && go run ./cmd/api migrate)
          echo "alter role cnote_app password :'pw';" | psql "$DATABASE_ADMIN_URL" -v pw="$DB_APP_PASSWORD"
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/migrations
      # fixtures and note.restore go through the Go API, which renders live documents through the collab service
      - name: Start collab and the Go API
        run: |
          COLLAB_PORT=4300 pnpm --filter @cnote/collab start > collab.log 2>&1 &
          (cd apps/api && go build -o ../../cnote-api ./cmd/api)
          PORT=4000 WITH_WORKER=1 COLLAB_URL=http://localhost:4300 ./cnote-api > go-api.log 2>&1 &
          npx --yes wait-on -t 120000 http://localhost:4000/healthz http://localhost:4300/healthz
      - run: pnpm --filter @cnote/collab typecheck
      - run: pnpm --filter @cnote/collab test
      - if: failure()
        run: tail -n 100 go-api.log collab.log

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @cnote/web typecheck
      - run: pnpm --filter @cnote/web test
      - run: pnpm build:web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @cnote/mobile typecheck
      - run: pnpm --filter @cnote/mobile test
      - name: Bundle check (no signing)
        run: pnpm --filter @cnote/mobile exec expo export --platform ios --platform android

  # Every browser flow against the production shape: web (proxying /api) -> Go API (worker included) + collab.
  e2e:
    runs-on: ubuntu-latest
    needs: [web]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cnote
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Generate throwaway credentials
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          echo "DB_APP_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://cnote_app:$PW@localhost:5432/cnote" >> "$GITHUB_ENV"
          SECRET=$(openssl rand -hex 16)
          echo "::add-mask::$SECRET"
          echo "COLLAB_INTERNAL_SECRET=$SECRET" >> "$GITHUB_ENV"
          MK=$(openssl rand -base64 32)
          echo "::add-mask::$MK"
          echo "CNOTE_MASTER_KEY=$MK" >> "$GITHUB_ENV" # per run; every process shares it
          ST=$(openssl rand -hex 16)
          echo "::add-mask::$ST"
          echo "SITES_SERVER_TOKEN=$ST" >> "$GITHUB_ENV" # the web server's token for reading published sites
      - name: Migrate
        run: |
          (cd apps/api && go run ./cmd/api migrate)
          echo "alter role cnote_app password :'pw';" | psql "$DATABASE_ADMIN_URL" -v pw="$DB_APP_PASSWORD"
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/migrations
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The browser talks to the Go API (:4100), which serves every request and routes live editing to the
      # TypeScript collab service (:4300), as in production.
      - run: pnpm build:web
        env:
          API_URL: http://localhost:4100
          NEXT_PUBLIC_COLLAB_URL: ws://localhost:4100
      - name: Start Go, collab and web
        run: |
          (cd apps/api && go build -o ../../cnote-api ./cmd/api)
          PUBLIC_BASE_URL=http://localhost:3000 PUBLIC_TRUSTED_PROXIES=127.0.0.1,::1 AUTH_SIGNUP_FREE=100000 AUTH_IP_FREE=100000 AI_ALLOW_PRIVATE_ENDPOINTS=1 PORT=4100 WITH_WORKER=1 COLLAB_URL=http://localhost:4300 CNOTE_PLATFORM_ADMINS=@example.test SITES_DOMAIN=localhost:3000 SITES_TEST_SKIP_VERIFY=1 SITES_CUSTOM_DOMAINS=1 SITES_APEX_IP=127.0.0.1 SITES_TEST_DNS=cnote-e2e.test SITES_SERVER_TOKEN=$SITES_SERVER_TOKEN SITES_WEB_URL=http://localhost:3000 SITES_LANGUAGES=1 SITES_ABUSE_SCAN=1 HOME_WIDGETS=1 ./cnote-api > go-api.log 2>&1 &
          COLLAB_PORT=4300 COLLAB_ALLOWED_ORIGINS=http://localhost:3000 pnpm --filter @cnote/collab start > collab.log 2>&1 &
          HOME_WIDGETS=1 API_URL=http://localhost:4100 SITES_DOMAIN=localhost:3000 SITES_CUSTOM_DOMAINS=1 SITES_LANGUAGES=1 SITES_ABUSE_SCAN=1 SITES_SERVER_TOKEN=$SITES_SERVER_TOKEN PUBLIC_BASE_URL=http://localhost:3000 pnpm --filter @cnote/web start > web.log 2>&1 &
          npx --yes wait-on -t 120000 http://localhost:4100/healthz http://localhost:4300/healthz http://localhost:3000
      - run: pnpm e2e
        env:
          HOME_WIDGETS: "1"
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3000 # through the web proxy, like production; matches PUBLIC_BASE_URL
      - if: failure()
        run: tail -n 200 go-api.log collab.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, collab, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: cnote-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
